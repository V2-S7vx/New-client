plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.beryx.jlink' version '3.1.1'
}

group = 'dev.space'
version = '0.3.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

javafx {
    version = '21.0.5'
    modules = [ 'javafx.controls', 'javafx.graphics' ]
}

application {
    mainModule = 'dev.mapz.launcher'
    mainClass = 'dev.mapz.launcher.LauncherApp'
}

jlink {
    options = [
        '--strip-debug',
        '--compress', '2',
        '--no-header-files',
        '--no-man-pages'
    ]

    launcher {
        name = 'space-launcher'
    }

    jpackage {
        imageName = 'space-launcher'
        installerName = 'space-launcher'
        installerType = 'exe'
        appVersion = '0.3.0'
        vendor = 'Space Launcher'
        description = 'Space Launcher for Minecraft: Java Edition'
        installerOptions = [
            '--win-menu',
            '--win-menu-group', 'Space Launcher',
            '--win-shortcut',
            '--win-shortcut-prompt'
        ]
    }
}

jar {
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}
